<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="library">
            <h1>My Library</h1>
            <div class="books">
                <div class="grid-cell">Number</div>
                <div class="grid-cell">Title</div>
                <div class="grid-cell">Author</div>
                <div class="grid-cell">Pages</div>
                <div class="grid-cell">Read</div>
            </div>
        </div>
        <button>Add a book</button>
        <dialog>
            <h1>New Book</h1>
            <form>
                <div class="input-group">
                    <label for="book-title">Title:</label>
                    <input type="text" id="book-title" required>
                </div>
                <div class="input-group">
                    <label for="book-author">Author:</label>
                    <input type="text" id="book-author" required>
                </div>
                <div class="input-group">
                    <label for="book-pages">Pages:</label>
                    <input type="number" id="book-pages" required>
                </div>
                <div class="input-group">
                    <label for="book-read">Have you read it?</label>
                    <input type="checkbox" id="book-read">
                </div>
                <button type="submit">Add the book</button>
            </form>
            <button id="close-button">Close</button>
        </dialog>
    </div>
</body>
</html>
